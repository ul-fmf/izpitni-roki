name: CreatePagesAndDeploy
on: 
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install pandas sphinx sphinx_rtd_theme
    
    - name: Sphinx build
      run: |
        sphinx-build docs _build
    # Poleg dokumentacije objavimo se testno stran (iz podatkov v test_data),
    # da je razvidno, kako je videti in deluje koncni izdelek. Pravih rokov
    # ne objavljamo: vhodnih .ics datotek v repozitoriju ni.
    - name: Build demo page
      run: |
        python naredi_testno_stran.py
        cp -r out _build/testna-stran
        cp out/testna_stran.html _build/testna-stran/index.html
    - name: Artifact upload
      uses: actions/upload-pages-artifact@v4
      with:
        path: _build
  # Deploy job
  deploy:
    # Add a dependency to the build job
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
