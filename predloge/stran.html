<!doctype html>
<html lang="{{koda_jezika}}">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css" crossorigin="anonymous">
    <link rel="stylesheet" href="{{predpona}}dodatni.css" >
    <link rel="icon" href="{{predpona}}favicon.ico" type="image/x-icon" />

    <title>{{title}}</title>
  </head>
  <body>
  <div class="mt-2 col-md-12">
    <nav class="navbar navbar-light glava-strani">
        <h1>{{naslov}}</h1>
        <div class="preklop-jezika">
          {{jeziki}}
        </div>
    </nav>

    <div class="mt-2 card">
      <div class="card-header">
        {{razdelek_o_strani}}
      </div>
      <div class="card-body">
        <p class="card-text">
            {{opis_strani}}
        </p>
        <p class="card-text">
            {{odstavek_ics}}
        </p>
        <p>
          <a href="mailto:matematika@fmf.uni-lj.si" class="btn btn-info">{{gumb_komentar}}</a>
        </p>
      </div>
    </div>

    <div class="mt-2 card">
      <div class="card-header">
        {{razdelek_izbira}}
      </div>
      <div class="card-body">
        <div class="vrstica-gumbov">
          {{spustni_meniji}}
        </div>
      </div>
    </div>

    <div class="mt-2 card">
      <div class="card-header">
        {{razdelek_izbrani}}
      </div>
      <div class="card-body">
        {{izpiti}}
      </div>
    </div>
  </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <script src="{{predpona}}permalink.js"></script>
    <script src="{{predpona}}posodabljanje.js"></script>
  </body>
</html>
