<div class="btn-group gumb-v-vrsti">
  <div class="dropdown">
    <button class="btn btn-success dropdown-toggle" type="button"
            data-toggle="dropdown" aria-expanded="true" id="gumb_{{razred}}">
      {{ime_menija}}
    </button>
    <ul class="dropdown-menu allow-focus checkbox-menu" aria-labelledby="dropdownMenuButton">
      <li><label class="dropdown-item group-choice" data-group="{{razred}}" id="grupa_{{razred}}"
                 data-izberi="{{izberi_vse}}" data-odstrani="{{odstrani_vse}}">{{odstrani_vse}}</label></li>
        <div class="dropdown-divider"></div>
      {{skupine}}
    </ul>
  </div>
</div>
